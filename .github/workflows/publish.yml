name: publish

# Manual-only until PyPI Trusted Publishing is configured for this project
# (PyPI > project > Settings > Publishing > add a GitHub publisher for this
# repo + workflow file). Releases are currently uploaded with twine.
# Once configured, add back:  release: { types: [published] }
on:
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build package
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
