[project]
name = "agentcare"
version = "0.3.0"
description = "Framework for healthcare voice-AI agents: front-desk booking, follow-ups, wellness check-ins, transcript extraction, and analytics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Irfan Ali", email = "irfanali29@hotmail.com" }]
maintainers = [{ name = "AgentCare Maintainers" }]
keywords = [
  "voice-ai",
  "healthcare",
  "ai-agents",
  "llm",
  "mistral",
  "bolna",
  "scheduling",
  "appointment-booking",
  "patient-communication",
  "wellness",
  "burnout-detection",
  "transcript-extraction",
  "automation",
  "fastapi",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Healthcare Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Communications :: Telephony",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "python-dotenv>=1.0.1",
  "typer>=0.12.3",
  "rich>=13.7.1",
  "mistralai>=1.0.0",
]

[project.optional-dependencies]
web = [
  "fastapi>=0.110.0",
  "uvicorn>=0.27.1",
]
postgres = [
  "psycopg[binary]>=3.2.0",
]
email = [
  "resend>=2.0.0",
]
semantic = [
  "ragfallback[huggingface,faiss]>=2.0.0",
]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.6.0",
  "langchain-core>=0.2.0",
  "build>=1.2.1",
  "twine>=5.1.1",
]

[project.scripts]
agentcare = "agentcare.cli:main"

[project.urls]
Homepage = "https://github.com/irfanalidv/AgentCare"
Documentation = "https://github.com/irfanalidv/AgentCare#readme"
Repository = "https://github.com/irfanalidv/AgentCare"
Issues = "https://github.com/irfanalidv/AgentCare/issues"
Changelog = "https://github.com/irfanalidv/AgentCare/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentcare = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.ipynb", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008", "B904", "B905", "UP031"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

